<head>

<title>El comedor · Primeros alimentos</title>
<meta name="description" content="Qué están comiendo ahora mismo los bebés que usan Primeros alimentos: desayunos, comidas, meriendas y cenas, en directo y de forma anónima.">

<style>
/*
VOICE: cálido y tranquilo, como la app
IDEA: el comedor de Primeros alimentos, servicio a servicio, con las fichas como el menú del día
PICTURE: escena 3D del restaurante a pantalla completa
COLOUR and TYPE: paleta de la app (crema y verde de día, azul noche de noche); Luckiest Guy + Montserrat
LAYOUT: logo arriba, escena, ficha abajo como la tarjeta del menú del día
*/
:root{--bg:#eeead8;--card:#f7f4e8;--ink:#262626;--mute:#6b6a5c;--line:#d8d3bc;--green:#4a8760;--terra:#c96a47;--blue:#3e4cd0;--acc:#c96a47;--onacc:#fff;--sheet:#f7f4e8;color-scheme:light}
:root[data-theme=dark]{--bg:#121232;--card:#1e1d46;--ink:#f1f0ff;--mute:#aeacd8;--line:#36356e;--green:#efeeff;--terra:#ffa77c;--blue:#a29dff;--acc:#a29dff;--onacc:#15143a;--sheet:#1a1942;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font:15px/1.5 Montserrat,system-ui,sans-serif;color:var(--ink)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.disp{font-family:'Luckiest Guy',cursive;font-weight:400;letter-spacing:.02em}
header{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;justify-content:center;pointer-events:none;transition:opacity .25s}
body.sh header{opacity:0}
.chips2{display:none}
.chip{position:relative;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;color:var(--terra);cursor:pointer;padding:0;box-shadow:0 4px 14px rgba(20,18,60,.10)}
.chip svg{width:26px;height:26px;display:block}
.chip b{position:absolute;right:-5px;bottom:-5px;min-width:21px;height:21px;padding:0 5px;border-radius:11px;background:var(--terra);color:var(--onacc);font:700 11px/21px Montserrat,sans-serif;text-align:center}
.chip i{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--terra);animation:p 1.6s infinite}
@keyframes p{50%{opacity:.3}}
.svc{margin:2px 0 0;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.div{display:flex;align-items:center;gap:10px;margin:10px 0 8px;color:var(--green)}
.div:before,.div:after{content:"";flex:1;height:1.5px;background:color-mix(in srgb,var(--green) 45%,transparent)}
.div svg{width:14px;height:14px;flex:none}
.empty{font-size:13px;color:var(--mute);margin:0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translate(-50%,12px);opacity:0;transition:.35s;display:flex;align-items:center;gap:14px;width:min(460px,calc(100% - 24px));line-height:1.3;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:10px 16px 10px 10px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(20,18,60,.18);max-width:calc(100% - 24px);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;cursor:pointer}
.toast .ico{width:40px;height:40px;flex:none}
.toast small{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--terra);margin-bottom:2px}.toast div{min-width:0}.toast b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(440px,calc(100% - 20px));max-height:84vh;overflow:auto;overscroll-behavior:contain;transform:translate(-50%,24px);opacity:0;pointer-events:none;transition:.28s;background:var(--sheet);border-radius:26px;padding:6px;box-shadow:0 18px 50px rgba(20,18,60,.3);z-index:2}
.sheet.open{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.sheet.mid{top:50%;bottom:auto;transform:translate(-50%,-46%)}.sheet.mid.open{transform:translate(-50%,-50%)}
.mdd{border:1.5px solid var(--green);border-radius:22px;padding:0 0 22px;overflow:hidden;box-shadow:inset 0 0 0 4px var(--sheet),inset 0 0 0 5.5px color-mix(in srgb,var(--green) 60%,transparent)}
.x{position:absolute;top:16px;right:16px;width:44px;height:44px;border:1.5px solid var(--line);background:var(--card);color:var(--mute);font-size:22px;line-height:1;cursor:pointer;border-radius:50%;z-index:3;display:grid;place-items:center}
.pv{position:relative;height:210px;background:#e6d2b6;border-bottom:1.5px solid var(--line)}
.pv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hd{padding:18px 24px 0;text-align:center}
.hd h2{font:400 28px/1.05 'Luckiest Guy',cursive;letter-spacing:.02em;color:var(--green);margin:0 44px 6px}
.hd .svc{margin:0}
.slot{display:flex;align-items:center;justify-content:space-between;margin:4px 24px 10px;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--terra)}
.row{display:flex;gap:16px;align-items:flex-start;padding:0 24px}
.plate{width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 6%,transparent)}
.plate .ico{width:56px;height:56px}
.row p{margin:4px 0 0;font-weight:700;font-size:18px;line-height:1.3}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--ink)}
.pill.t{background:color-mix(in srgb,var(--terra) 16%,transparent);color:var(--terra)}
.pill.n{background:var(--terra);color:var(--onacc)}
.lnk{display:inline-flex;align-items:center;gap:8px;min-height:44px;margin-top:6px;padding:0;border:0;background:none;font:700 15px Montserrat,sans-serif;color:var(--terra);cursor:pointer}
.lnk span{color:var(--ink);font-weight:600}
.rec{padding:4px 24px 0}
.rec[hidden]{display:none}
.rec h3{margin:16px 0 8px;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--terra)}
.rec ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rec li.i{display:flex;align-items:center;gap:12px;font-size:15px}
.rec li.i .ico{width:30px;height:30px;flex:none}
.rec ol{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15px}
.offer{margin-top:16px;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--green) 12%,transparent);font-size:14px}
.offer b{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--green);margin-bottom:4px}
.note{display:block;margin:18px 24px 0;color:var(--mute);font-size:12px;text-align:center}
.cta{display:flex;align-items:center;justify-content:center;min-height:48px;margin:16px 24px 0;border-radius:16px;background:var(--terra);color:var(--onacc);font-weight:700;text-decoration:none}
.list{list-style:none;margin:0;padding:0 24px;display:grid;gap:12px}
.list li{display:flex;align-items:center;gap:14px;font-weight:600}
.list .ico{width:40px;height:40px;flex:none}
.list small{color:var(--mute);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;padding:0 24px}
.it{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-size:13px;font-weight:600;padding:10px 4px;border-radius:16px;background:color-mix(in srgb,var(--ink) 5%,transparent)}
.it .ico{width:40px;height:40px}.it small{color:var(--mute);font-size:11px}
.cm .hd{padding-top:16px!important}.cm .hd h2{font-size:24px;margin-bottom:2px}
.cm .div{margin:8px 24px!important}
.cm .slot{margin:10px 24px 4px!important;font-size:11px}
.cm .row{gap:12px;align-items:center}
.cm .plate{width:48px;height:48px}.cm .plate .ico{width:40px;height:40px}
.cm .row p{font-size:15px;margin:0;line-height:1.25}
.cm .pills{display:none}
.cm .lnk{min-height:30px;margin-top:2px;font-size:13px}
.cm .note{margin-top:12px;font-size:11px}
.cm .rec{padding-top:0}
.svcs{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 24px 0}
.sv{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:64px;padding:12px 14px;border-radius:18px;border:1.5px solid var(--line);background:color-mix(in srgb,var(--ink) 4%,transparent);color:var(--ink);font:600 13px Montserrat,sans-serif;cursor:pointer;text-align:left}
.sv b{font-size:16px}.sv span{color:var(--mute);font-size:12px}
.sv.on{border-color:var(--terra);background:color-mix(in srgb,var(--terra) 14%,transparent)}
.sv:disabled{opacity:.4;cursor:default}
.cm .list{gap:8px}.cm .list li{font-size:14px;gap:12px}.cm .list .ico{width:32px;height:32px}
.cm .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.cm .it{padding:6px 2px;font-size:11px}.cm .it .ico{width:30px;height:30px}
.agt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 24px 0}.agt .op{min-height:38px;padding:6px 4px;font-size:12px}
.cm .how{display:block;color:var(--mute);font-size:12px;font-weight:600;line-height:1.35;margin-top:2px}
.say{padding:0 24px;font-size:15px;line-height:1.5}.say p{margin:0 0 10px}
.opts{display:flex;flex-direction:column;gap:8px;padding:6px 24px 4px}
.op{display:flex;align-items:center;justify-content:center;min-height:46px;padding:10px 16px;border-radius:16px;border:1.5px solid var(--line);background:color-mix(in srgb,var(--ink) 4%,transparent);color:var(--ink);font:600 14px Montserrat,sans-serif;cursor:pointer;text-decoration:none;text-align:center}
.op.main{background:var(--terra);border-color:var(--terra);color:var(--onacc);font-weight:700}
.ages{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.op.age{font-size:16px;font-weight:700}
.kit{pointer-events:auto;cursor:pointer;background:var(--card);color:var(--terra);border:1.5px solid var(--line);font:700 13px Montserrat,sans-serif;min-height:34px;padding:6px 14px;border-radius:18px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.12);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
#tags .tag{transition:opacity .25s}
.ico{display:block}
.fd{width:100%;height:100%;fill:none;display:block}.fd .o{stroke:none}
.fd .o[fill="none"]{stroke:rgba(0,0,0,.4);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}.fd .o.w{stroke:#fff!important}
@media(prefers-reduced-motion:reduce){.toast,.sheet{transition:none}.svc i{animation:none}}
</style>

</head>

</section>

{const tp=new Map();let g0=null;const cv=$('c'),sp=new THREE.Spherical(),off=new THREE.Vector3();

function chefStep(dt,t){if(reduce)return;CH.t+=dt;const walk=1.2;
 if(CH.t<walk){const q=CH.t/walk,e=q*q*(3-2*q);chef.position.lerpVectors(CH.from,CH.to,e);chef.position.y=Math.abs(Math.sin(CH.t*9))*.04;

  if(!k)P=REST;

  b.head.position.y=b.s+.82+Math.sin(t*2+b.ph)*.02*k-(chew?Math.abs(Math.sin(t*14))*.025:0);b.head.rotation.x=.18*lean*k;

 });
